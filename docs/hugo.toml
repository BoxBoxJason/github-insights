baseURL = "https://boxboxjason.github.io/github-insights/"
title = "github-insights"
locale = "en-US"

# "Last updated" dates on pages come from git history, so CI must check out all of it.
enableGitInfo = true
enableRobotsTXT = true

# Hugo does not merge `markup` from a theme: keep this block in every site.
[markup]
  [markup.highlight]
    noClasses = false

# Look and feel (colours, favicon, footer, search, ...) come from the shared theme,
# which is the same for every documentation site. Only project specifics live here.
[module]
  [[module.imports]]
    path = "github.com/boxboxjason/hugo-theme"

[menu]
  [[menu.main]]
    name = "Documentation"
    pageRef = "/docs"
    weight = 1
  [[menu.main]]
    name = "Releases"
    url = "https://github.com/boxboxjason/github-insights/releases"
    weight = 2
  [[menu.main]]
    name = "Search"
    weight = 3
    [menu.main.params]
      type = "search"
  [[menu.main]]
    name = "GitHub"
    weight = 4
    url = "https://github.com/boxboxjason/github-insights"
    [menu.main.params]
      icon = "github"

[params]
  description = "github-insights is a Go CLI that exports your GitHub pull requests, reviews, issues, mentions and releases over a date range as JSON."
  # Social preview (1200x630), rendered with the theme's tools/social-card.mjs.
  images = ["images/social.png"]
  # Structured data (JSON-LD) for the home page. The repository has no LICENSE file yet.
  [params.project]
    repository = "https://github.com/boxboxjason/github-insights"
    programmingLanguage = "Go"
  [params.editURL]
    base = "https://github.com/boxboxjason/github-insights/edit/main/docs/content"
